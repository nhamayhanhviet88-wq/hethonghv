<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bộ Sưu Tập / BST — Đồng Phục HV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/images/logo.png" type="image/png">
    
    <!-- Unified Mobile Style -->
    <link rel="stylesheet" href="/css/mobile-nav.css?v=20260621">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            padding-bottom: 80px;
        }
        .container {
            padding: 16px;
            margin-top: 60px;
        }
        .header-card {
            background: linear-gradient(135deg, #1e1b4b, #4338ca);
            border-radius: 16px;
            padding: 24px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(67, 56, 202, 0.3);
        }
        .header-card h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 800;
        }
        .header-card p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
        }
        .card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div id="mobileHeader"></div>

    <div class="container">
        <!-- Header Card -->
        <div class="header-card">
            <h2>🖼️ Bộ Sưu Tập / BST</h2>
            <p>Trang quản lý và trưng bày Bộ Sưu Tập sản phẩm đang được hoàn thiện.</p>
        </div>

        <div class="card">
            <div style="font-size: 48px; margin-bottom: 12px;">🎨</div>
            <h3 style="margin: 0 0 8px; font-size: 18px; color: #1e293b;">Tính năng đang phát triển</h3>
            <p style="margin: 0; font-size: 13px; color: #64748b; line-height: 1.5;">Giao diện Bộ Sưu Tập / BST trên di động sẽ sớm được cập nhật.</p>
        </div>
    </div>

    <!-- Unified Mobile Drawer -->
    <script src="/js/mobile-nav.js"></script>
</body>
</html>
